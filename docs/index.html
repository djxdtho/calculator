<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Calc — AA Elements</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0a0c;overflow:hidden}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 25% 30%,#00d4ff06,transparent 55%),radial-gradient(ellipse at 75% 70%,#5b0fbe08,transparent 55%)}
.calc{position:relative;z-index:1;width:380px;padding:20px;background:rgba(255,255,255,.03);backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);border:1px solid rgba(255,255,255,.06);border-radius:28px;box-shadow:0 24px 80px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.04)}
.calc::before{content:'';position:absolute;inset:-1px;border-radius:28px;padding:1px;background:conic-gradient(from 0deg,transparent,#00d4ff22,transparent,#5b0fbe22,transparent);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.display-wrap{margin-bottom:16px;padding:16px 18px;background:rgba(0,0,0,.5);border-radius:18px;border:1px solid rgba(255,255,255,.04);position:relative;overflow:hidden}
.display-wrap::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent)}
.expr{color:rgba(255,255,255,.3);font-size:13px;min-height:18px;text-align:right;font-family:'Cascadia Code','Fira Code',monospace;letter-spacing:.3px;word-break:break-all;transition:color .3s}
.result{color:#fff;font-size:38px;font-weight:200;text-align:right;word-break:break-all;transition:font-size .15s;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.result.small{font-size:26px}
.mode-bar{display:flex;gap:6px;margin-bottom:12px;padding:3px;background:rgba(255,255,255,.04);border-radius:12px}
.mode-btn{flex:1;padding:6px;border:none;border-radius:9px;background:transparent;color:rgba(255,255,255,.4);font-size:11px;font-weight:600;cursor:pointer;transition:all .25s;text-transform:uppercase;letter-spacing:.8px}
.mode-btn.active{background:rgba(0,212,255,.15);color:#00d4ff;box-shadow:0 2px 12px rgba(0,212,255,.1)}
.sci-btns{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:8px;max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.22,1,.36,1),opacity .3s,margin .3s;opacity:0}
.sci-btns.open{max-height:180px;opacity:1}
.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btn{aspect-ratio:1;border:none;border-radius:14px;font-size:18px;font-weight:500;cursor:pointer;transition:transform .1s,background .15s,box-shadow .15s;background:rgba(255,255,255,.05);color:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;user-select:none;font-family:inherit;position:relative;overflow:hidden}
.btn::after{content:'';position:absolute;inset:0;border-radius:14px;background:linear-gradient(135deg,rgba(255,255,255,.04),transparent 50%);pointer-events:none}
.btn:hover{background:rgba(255,255,255,.09)}
.btn:active{transform:scale(.92);box-shadow:0 0 20px rgba(0,212,255,.05)}
.btn-sci{background:rgba(255,255,255,.03);color:rgba(255,255,255,.5);font-size:12px;border-radius:10px;font-weight:600;letter-spacing:.2px}
.btn-sci:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.7)}
.btn-sci:active{transform:scale(.92)}
.btn-fn{color:rgba(0,212,255,.7);background:rgba(0,212,255,.06)}
.btn-fn:hover{background:rgba(0,212,255,.14)}
.btn-op{color:#00d4ff;background:rgba(0,212,255,.1)}
.btn-op:hover{background:rgba(0,212,255,.2)}
.btn-eq{background:linear-gradient(135deg,#00d4ff,#5b0fbe);color:#fff;font-size:22px}
.btn-eq:hover{box-shadow:0 4px 24px rgba(0,212,255,.25)}
.btn-clear{color:#ff6b35;background:rgba(255,107,53,.08)}
.btn-clear:hover{background:rgba(255,107,53,.18)}
.btn-zero{grid-column:span 2;aspect-ratio:auto}
footer{position:fixed;bottom:20px;z-index:1;color:rgba(255,255,255,.15);font-size:11px;letter-spacing:.5px}
footer a{color:rgba(255,255,255,.25);text-decoration:none}
footer a:hover{color:rgba(255,255,255,.5)}
@media(max-width:420px){.calc{width:calc(100vw-24px);padding:16px;border-radius:22px}.result{font-size:30px}.btn{font-size:16px;border-radius:12px}.sci-btns.open{max-height:160px}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="calc" role="application" aria-label="Scientific Calculator">
  <div class="display-wrap">
    <div class="expr" id="expr"></div>
    <div class="result" id="result">0</div>
  </div>
  <div class="mode-bar">
    <button class="mode-btn active" data-mode="basic">Basic</button>
    <button class="mode-btn" data-mode="sci">Scientific</button>
  </div>
  <div class="sci-btns" id="sciBtns">
    <button class="btn btn-sci" data-sci="sin">sin</button>
    <button class="btn btn-sci" data-sci="cos">cos</button>
    <button class="btn btn-sci" data-sci="tan">tan</button>
    <button class="btn btn-sci" data-sci="log">log</button>
    <button class="btn btn-sci" data-sci="ln">ln</button>
    <button class="btn btn-sci" data-sci="√">√</button>
    <button class="btn btn-sci" data-sci="x²">x²</button>
    <button class="btn btn-sci" data-sci="x³">x³</button>
    <button class="btn btn-sci" data-sci="xʸ">xʸ</button>
    <button class="btn btn-sci" data-sci="!">!</button>
    <button class="btn btn-sci" data-sci="π">π</button>
    <button class="btn btn-sci" data-sci="e">e</button>
    <button class="btn btn-sci" data-sci="(">(</button>
    <button class="btn btn-sci" data-sci=")">)</button>
    <button class="btn btn-sci" data-sci="1/x">1/x</button>
  </div>
  <div class="buttons" id="mainBtns">
    <button class="btn btn-clear" data-v="C">C</button>
    <button class="btn btn-op" data-v="±">±</button>
    <button class="btn" data-v="%">%</button>
    <button class="btn btn-op" data-v="÷">÷</button>
    <button class="btn" data-v="7">7</button>
    <button class="btn" data-v="8">8</button>
    <button class="btn" data-v="9">9</button>
    <button class="btn btn-op" data-v="×">×</button>
    <button class="btn" data-v="4">4</button>
    <button class="btn" data-v="5">5</button>
    <button class="btn" data-v="6">6</button>
    <button class="btn btn-op" data-v="-">−</button>
    <button class="btn" data-v="1">1</button>
    <button class="btn" data-v="2">2</button>
    <button class="btn" data-v="3">3</button>
    <button class="btn btn-op" data-v="+">+</button>
    <button class="btn btn-zero" data-v="0">0</button>
    <button class="btn" data-v=".">.</button>
    <button class="btn btn-eq" data-v="=">=</button>
  </div>
</div>
<footer>by <a href="https://djxdtho.github.io/3D-portfolio/" target="_blank">AA Elements</a></footer>
<script>
const resultEl=document.getElementById('result'),exprEl=document.getElementById('expr'),sciBtns=document.getElementById('sciBtns');
let mode='basic',a='',op='',b='',res=null,justEval=false,angleMode='deg';

document.querySelectorAll('.mode-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');mode=btn.dataset.mode;
    sciBtns.classList.toggle('open',mode==='sci');
  });
});

function updateDisplay(){
  const r=res!==null?formatNum(res):b||a||'0';
  resultEl.textContent=r;
  resultEl.classList.toggle('small',r.length>10);
  exprEl.textContent=op?`${formatNum(a||'0')} ${op} ${b||'…'}`:'';
}

function formatNum(n){
  const s=String(n);
  if(s.length>14)return Number(n).toExponential(4);
  return s;
}

function compute(x,y,oper){
  const na=parseFloat(x),nb=parseFloat(y);
  if(isNaN(na)||(oper!=='!'&&oper!=='±'&&isNaN(nb)))return NaN;
  switch(oper){
    case'+':return na+nb;case'−':return na-nb;case'×':return na*nb;case'÷':return nb!==0?na/nb:NaN;
    case'xʸ':return Math.pow(na,nb);
    case'!':{if(na<0||na>170||na%1!==0)return NaN;let f=1;for(let i=2;i<=na;i++)f*=i;return f}
    case'±':return-na;
    default:return NaN;
  }
}

function applySci(fn){
  const val=res!==null?res:parseFloat(b||a);
  if(isNaN(val))return;
  let r;
  const deg=rad=>angleMode==='deg'?rad*Math.PI/180:rad;
  switch(fn){
    case'sin':r=Math.sin(deg(val));break;
    case'cos':r=Math.cos(deg(val));break;
    case'tan':r=Math.tan(deg(val));break;
    case'log':r=Math.log10(val);break;
    case'ln':r=Math.log(val);break;
    case'√':r=Math.sqrt(val);break;
    case'x²':r=val*val;break;
    case'x³':r=val*val*val;break;
    case'1/x':r=val!==0?1/val:NaN;break;
    case'π':r=Math.PI;break;
    case'e':r=Math.E;break;
    default:return;
  }
  if(isNaN(r)||!isFinite(r)){resultEl.textContent='Error';res=null;a='';op='';b='';justEval=false;updateDisplay();return}
  res=parseFloat(Number(r).toPrecision(12));a=String(res);op='';b='';justEval=true;updateDisplay();
}

document.getElementById('mainBtns').addEventListener('click',e=>{
  const v=e.target.dataset.v;if(!v)return;
  if(v==='C'){a='';op='';b='';res=null;justEval=false;updateDisplay();return}
  if(v==='±'){if(res!==null){res*=-1;updateDisplay();return}const t=b||a;if(t){const n=t.startsWith('-')?t.slice(1):'-'+t;if(b!=='')b=n;else a=n;updateDisplay()}return}
  if(v==='%'){if(res!==null){res/=100;res=parseFloat(res.toFixed(10));updateDisplay();return}const t=b||a;if(t){const n=String(parseFloat(t)/100);if(b!=='')b=n;else a=n;updateDisplay()}return}
  if('+-×÷'.includes(v)){if(b){const r=compute(a,b,op);if(isNaN(r)){resultEl.textContent='Error';a='';op='';b='';res=null;updateDisplay();return}res=r;a=String(res)}a=res!==null?String(res):a||'0';op=v;b='';res=null;justEval=false;updateDisplay();return}
  if(v==='='){if(op&&b){const r=compute(a,b,op);if(isNaN(r)){resultEl.textContent='Error';a='';op='';b='';res=null;updateDisplay();return}res=r;a=String(res);op=''}updateDisplay();justEval=true;return}
  if(/[\d.]/.test(v)){
    if(justEval||res!==null&&!op){a='';b='';res=null;justEval=false}
    const t=b!==''||op?'b':'a';
    if(v==='.'&&(t==='a'?a:b).includes('.'))return;
    if(t==='a')a+=v;else b+=v;
    updateDisplay();
  }
});

sciBtns.addEventListener('click',e=>{
  const fn=e.target.dataset.sci;if(!fn)return;
  if(fn==='('||fn===')')return;
  if(fn==='xʸ'){if(b){const r=compute(a,b,op);if(isNaN(r)){resultEl.textContent='Error';a='';op='';b='';res=null;updateDisplay();return}res=r;a=String(res)}a=res!==null?String(res):a||'0';op='xʸ';b='';res=null;justEval=false;updateDisplay();return}
  applySci(fn);
});

document.addEventListener('keydown',e=>{
  const m={'Enter':'=','Escape':'C','Delete':'C','/':'÷','*':'×','-':'−'};
  const k=m[e.key]||e.key;
  const btn=document.querySelector(`[data-v="${k}"]`);
  if(btn){btn.click();btn.style.transform='scale(.92)';setTimeout(()=>btn.style.transform='',120)}
});
</script>
</body>
</html>
